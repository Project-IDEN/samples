# The IDEN OIDC playground: the Next.js server, on plain HTTP :5100.
#
#   cp .env.example .env    # then fill it in
#   docker compose up --build -d

name: iden-playground

services:
  playground:
    build: .
    environment:
      IDEN_ISSUER: ${IDEN_ISSUER:?set IDEN_ISSUER in .env}
      PLAYGROUND_URL: ${PLAYGROUND_URL:?set PLAYGROUND_URL in .env}
      PLAYGROUND_CLIENT_ID: ${PLAYGROUND_CLIENT_ID:-playground}
      PLAYGROUND_CLIENT_SECRET: ${PLAYGROUND_CLIENT_SECRET:-}
    ports:
      - "5100:5100"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5100/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
