# The IDEN door panel: the Next.js server, on plain HTTP :5200.
#
#   cp .env.example .env    # then fill it in (scripts/seed.mjs prints the secret)
#   docker compose up --build -d

name: iden-door-panel

services:
  door-panel:
    build: .
    environment:
      IDEN_ISSUER: ${IDEN_ISSUER:?set IDEN_ISSUER in .env}
      DOOR_PANEL_URL: ${DOOR_PANEL_URL:?set DOOR_PANEL_URL in .env}
      DOOR_PANEL_CLIENT_ID: ${DOOR_PANEL_CLIENT_ID:-door-panel}
      DOOR_PANEL_CLIENT_SECRET: ${DOOR_PANEL_CLIENT_SECRET:?set DOOR_PANEL_CLIENT_SECRET in .env}
      DOOR_PANEL_IDLE_SECONDS: ${DOOR_PANEL_IDLE_SECONDS:-60}
      BUILDING_AUDIENCE: ${BUILDING_AUDIENCE:-https://building.example/doors}
      # The panel calls its own door API inside the container.
      DOOR_API_URL: http://127.0.0.1:5200/api/doors
    ports:
      - "5200:5200"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5200/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
