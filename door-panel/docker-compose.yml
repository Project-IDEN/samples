# The IDEN door panel: the Next.js server, on plain HTTP :5200.
#
#   cp .env.example .env    # then fill it in
#   pnpm seed               # sets IDEN up, and writes the client secret into .env
#   docker compose up --build -d

name: iden-door-panel

services:
  door-panel:
    build: .
    # The same file `pnpm dev` and `pnpm seed` read.
    env_file:
      - path: .env
        required: true
    ports:
      - "5200:5200"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5200/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
